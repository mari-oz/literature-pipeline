version: "3.9"

services:
  literature-pipeline:
    build: .
    container_name: literature-pipeline
    command: ["python", "-m", "app.main"]
    environment:
      DB_PATH: /data/pipeline.db
      DIGEST_DIR: /data/digests
      ENABLE_SUMMARY: "true"
      MODEL_PATH: /models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      MODEL_NAME: Qwen2.5-7B-Instruct-Q4_K_M.gguf
      N_CTX: "4096"
      N_GPU_LAYERS: "0"
    volumes:
      - /mnt/Vault/Apps/literature-pipeline/data:/data
      - /mnt/Vault/Apps/literature-pipeline/models:/models:ro
      - /mnt/Vault/Apps/literature-pipeline/config:/config
      - /mnt/Vault/Apps/literature-pipeline/output:/output
    restart: "no"

  digest-viewer:
    build: .
    container_name: literature-digest-viewer
    command: ["python", "-m", "app.serve_digest", "--host", "0.0.0.0", "--port", "8080", "--dir", "/data/digests"]
    environment:
      DIGEST_DIR: /data/digests
    volumes:
      - /mnt/Vault/Apps/literature-pipeline/data:/data:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
