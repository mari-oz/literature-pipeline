services:
  literature-pipeline:
    image: ghcr.io/mari-oz/literature-pipeline:latest
    container_name: literature-pipeline
    restart: "no"
    environment:
      TZ: Europe/Berlin
      CONFIG_PATH: /config/config.yaml
      DB_PATH: /data/pipeline.db
    command: ["python", "-m", "app.main"]
    volumes:
      - /mnt/Vault/Apps/literature-pipeline/config:/config
      - /mnt/Vault/Apps/literature-pipeline/data:/data
      - /mnt/Vault/Apps/literature-pipeline/logs:/logs
      - /mnt/Vault/Apps/literature-pipeline/output:/output
